name: 6.12.38 一加15T 干净可启动基线
run-name: 15T clean bootbase · ${{ inputs.build_request_id || 'manual' }}

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android16'
  KERNEL_VERSION: '6.12'
  SUB_VERSION: '38'
  KERNEL_NAME: 'android16-5-gbe6292a1543d-ab14525421-4k'
  KERNEL_SOURCE_REPO: 'zaomi893/android_kernel_common_oneplus_sm8850'
  KERNEL_SOURCE_BRANCH: 'oneplus/sm8850_b_16.0_oneplus_15t'
  KERNEL_SOURCE_COMMIT: '14ba6a5ab0ffe4d6a67d6365139323a2f8ae1479'
  CCACHE_KEY: ccache-clean-6.12.38-oneplus15t-14ba6a5-r547379

on:
  workflow_dispatch:
    inputs:
      build_request_id:
        description: '构建关联标识'
        required: false
        type: string
        default: 'manual'
      build_date:
        description: 'uname -v 构建时间戳'
        required: false
        type: string
        default: 'Mon Dec 1 03:28:37 UTC 2025'
      ccache_update:
        description: '保存本次生成的 ccache 缓存'
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  build:
    name: 构建干净 15T 内核
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      ak3name: ${{ steps.package.outputs.ak3name }}
    steps:
      - name: 检出本仓库构建资源
        uses: actions/checkout@v4

      - name: 安装依赖并拉取 15T 源码与工具链
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kernel_workspace
          mkdir -p kernel_workspace
          cd kernel_workspace
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils python-is-python3 libssl-dev libelf-dev libdw-dev \
            dwarves kmod ccache zip unzip bc bison flex rsync file
          sudo install -m 0755 "$GITHUB_WORKSPACE/lib/ccache-x86-64" /usr/local/bin/ccache

          git clone --depth=1 --branch "$KERNEL_SOURCE_BRANCH" \
            "https://github.com/$KERNEL_SOURCE_REPO.git" common
          test "$(git -C common rev-parse HEAD)" = "$KERNEL_SOURCE_COMMIT"

          mkdir -p clang19 rust
          aria2c -s16 -x16 -k1M \
            https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/clang-r547379.zip \
            -o clang.zip
          unzip -q clang.zip -d clang19
          rm -f clang.zip
          aria2c -s16 -x16 -k1M \
            https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/rust.zip \
            -o rust.zip
          unzip -q rust.zip -d rust
          rm -f rust.zip
          aria2c -s16 -x16 -k1M \
            https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/build-tools.zip \
            -o build-tools.zip
          unzip -q build-tools.zip
          rm -f build-tools.zip
          mkdir -p kernel-build-tools
          git -C kernel-build-tools init -q
          git -C kernel-build-tools remote add origin https://git.codelinaro.org/clo/la/kernel/prebuilts/build-tools.git
          git -C kernel-build-tools fetch -q --depth=1 origin 4ba19a61c7a0d63603e0d1c84eb2b610bff706a4
          git -C kernel-build-tools checkout -q --detach FETCH_HEAD
          test -x kernel-build-tools/linux-x86/bin/pahole

          sed -i 's/ -dirty//g' common/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' common/scripts/setlocalversion

      - name: 加入当前 ReSukiSU root
        id: resukisu
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace
          curl -fLSs \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            | bash -s main
          echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@ZAOMI"' >> common/arch/arm64/configs/gki_defconfig
          echo 'CONFIG_KSU_TOOLKIT_SUPPORT=y' >> common/arch/arm64/configs/gki_defconfig
          KSU_VERSION=$(expr $(git -C KernelSU rev-list --count main) + 30700 2>/dev/null || echo 0)
          test "$KSU_VERSION" -gt 30700
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
          echo "ksuver=$KSU_VERSION" >> "$GITHUB_OUTPUT"

      - name: 配置 ccache
        id: ccache_restore
        uses: actions/cache@v4
        with:
          path: ~/.ccache_6.12.38_clean_15t
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_KEY }}-

      - name: 准备干净构建配置
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace/common
          sed -i "\$s|echo \"\$res\"|echo \"-${{ env.KERNEL_NAME }}\"|" scripts/setlocalversion
          sed -i 's/${scm_version}//' scripts/setlocalversion
          echo 'CONFIG_LOCALVERSION_AUTO=n' >> arch/arm64/configs/gki_defconfig

      - name: 构建 15T 干净 Image
        id: build_kernel
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/kernel_workspace"
          COMMON="$ROOT/common"
          export PATH="$ROOT/clang19/bin:$ROOT/build-tools/bin:$ROOT/rust/bin:/usr/lib/ccache:$PATH"
          export CLANG_DIR="$ROOT/clang19/bin"
          export LIBCLANG_PATH="$ROOT/clang19/lib"
          export CCACHE_DIR="$HOME/.ccache_6.12.38_clean_15t"
          export CCACHE_MAXSIZE=3G
          export CCACHE_COMPILERCHECK=none
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_NOHASHDIR=true
          export CCACHE_NOHARDLINK=true
          export CCACHE_IS_KERNEL_COMPILING=true
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"

          cd "$COMMON"
          if [[ -n "${{ inputs.build_date }}" ]]; then
            KERNEL_BUILD_DATE="${{ inputs.build_date }}"
          else
            KERNEL_BUILD_DATE="$(date -u +'%a %b %-d %H:%M:%S UTC %Y')"
          fi
          export KBUILD_BUILD_TIMESTAMP="$KERNEL_BUILD_DATE"
          export KBUILD_BUILD_USER=kernel
          export KBUILD_BUILD_HOST=kleaf
          export KBUILD_BUILD_VERSION=1
          echo "builddate=$KERNEL_BUILD_DATE" >> "$GITHUB_OUTPUT"

          export RUSTC=rustc
          export BINDGEN=bindgen
          export LLVM=1 LLVM_IAS=1
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC='ccache clang' CXX='ccache clang++'
          export HOSTCC='ccache clang' HOSTCXX='ccache clang++'
          export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          source ./_setup_env.sh 2>/dev/null || true

          cat > ld-wrapper <<'EOF'
          #!/bin/bash
          exec ld.lld "$@" --thinlto-jobs=$(nproc --all)
          EOF
          chmod +x ld-wrapper

          export KCFLAGS="-fdebug-prefix-map=$GITHUB_WORKSPACE=. -fmacro-prefix-map=$GITHUB_WORKSPACE=. -ffile-prefix-map=$GITHUB_WORKSPACE=. -no-canonical-prefixes -mcpu=oryon-1 -O2 -pipe -Wno-error -Qunused-arguments -Wno-unused-command-line-argument -D__ANDROID_COMMON_KERNEL__"
          export KCPPFLAGS="-fdebug-prefix-map=$GITHUB_WORKSPACE=. -fmacro-prefix-map=$GITHUB_WORKSPACE=. -ffile-prefix-map=$GITHUB_WORKSPACE=. -DCONFIG_OPTIMIZE_INLINING"

          make LD="$PWD/ld-wrapper" HOSTLD="$PWD/ld-wrapper" O=out gki_defconfig
          scripts/config --file out/.config \
            -e LTO_CLANG -e LTO_CLANG_NONE \
            -d LTO_CLANG_THIN -d LTO_CLANG_FULL
          make LD="$PWD/ld-wrapper" HOSTLD="$PWD/ld-wrapper" O=out olddefconfig
          grep -qx 'CONFIG_LTO_NONE=y' out/.config
          grep -qx 'CONFIG_KSU=y' out/.config
          make PAHOLE="$ROOT/kernel-build-tools/linux-x86/bin/pahole" \
            LD="$PWD/ld-wrapper" HOSTLD="$PWD/ld-wrapper" \
            -j"$(nproc --all)" O=out KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" Image \
            2>&1 | tee build.log

          test -s out/arch/arm64/boot/Image
          echo "Image=$COMMON/out/arch/arm64/boot/Image" >> "$GITHUB_ENV"
          ccache -s

      - name: 验证 15T 干净 Image 启动基线
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GITHUB_WORKSPACE/kernel_workspace/common/out/arch/arm64/boot/Image"
          OUT="$GITHUB_WORKSPACE/kernel_workspace/common/out"
          test -s "$IMAGE"
          file "$IMAGE" | grep -qiE 'ARM64|aarch64'
          SIZE=$(stat -c%s "$IMAGE")
          test "$SIZE" -gt 6000000
          BANNER=$(strings "$IMAGE" | grep -m1 '^Linux version ' || true)
          echo "$BANNER"
          [[ "$BANNER" == *'Linux version 6.12.38-android16-5-gbe6292a1543d-ab14525421-4k'* ]]
          [[ "$BANNER" == *'Mon Dec 1 03:28:37 UTC 2025'* ]]
          grep -aFq 'based on r547379' "$IMAGE"
          grep -qx 'CONFIG_LTO_NONE=y' "$OUT/.config"
          grep -qx 'CONFIG_KSU=y' "$OUT/.config"
          grep -qx 'CONFIG_DEBUG_INFO_BTF=y' "$OUT/.config"
          echo 'PASS: clean OP15T Image passed boot-baseline checks'

      - name: 保存 ccache
        if: ${{ inputs.ccache_update }}
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache_6.12.38_clean_15t
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}

      - name: 使用通用 AnyKernel3 打包
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace
          git clone --depth=1 --branch master \
            https://github.com/zaomi893/AnyKernel3_ZAOMI ak3
          rm -rf ak3/.git ak3/serial_lock
          cp common/out/arch/arm64/boot/Image ak3/Image
          grep -q '^clear_legacy_ksud_attrs()' ak3/anykernel.sh
          grep -q 'chattr -ia' ak3/anykernel.sh
          ZIP="AK3_OP15T_CLEAN_ReSukiSU_${KSU_VERSION}_6.12.38_${{ env.KERNEL_NAME }}.zip"
          (cd ak3 && zip -r9 "../$ZIP" . -x '*.git*')
          echo "ak3name=$ZIP" >> "$GITHUB_OUTPUT"

      - name: 上传干净可启动基线
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ak3name }}
          path: kernel_workspace/${{ steps.package.outputs.ak3name }}
          if-no-files-found: error
          retention-days: 30
