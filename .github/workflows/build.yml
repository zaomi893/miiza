name: Build OnePlus 15 stock-HMBIRD GKI

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: Root implementation
        type: choice
        required: true
        default: resukisu
        options:
          - resukisu
          - none

permissions:
  contents: read

env:
  STOCK_COMMIT: b2a876903b495c444a94b16f50d1463ffe953957
  STOCK_RELEASE: 6.12.23-android16-5-gb2a876903b49-ab14541642-4k
  TOOLCHAIN_URL: https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 bc binutils bison ccache cpio curl dwarves flex git \
            libdw-dev libelf-dev libssl-dev lld make pahole perl \
            python3 rustc unzip xz-utils zip

      - name: Restore toolchain and compiler cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            kernel_workspace
            .ccache
          key: oneplus15-stock-gki-r536225-${{ env.STOCK_COMMIT }}-${{ inputs.ksu_type }}
          restore-keys: |
            oneplus15-stock-gki-r536225-${{ env.STOCK_COMMIT }}-

      - name: Download Android clang 19 toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p kernel_workspace/clang19 kernel_workspace/rust
          aria2c -q -x16 -s16 "$TOOLCHAIN_URL/clang-r536225.zip" -o clang.zip
          unzip -q clang.zip -d kernel_workspace/clang19
          aria2c -q -x16 -s16 "$TOOLCHAIN_URL/rust.zip" -o rust.zip
          unzip -q rust.zip -d kernel_workspace/rust
          aria2c -q -x16 -s16 "$TOOLCHAIN_URL/build-tools.zip" -o build-tools.zip
          unzip -q build-tools.zip -d kernel_workspace
          rm -f clang.zip rust.zip build-tools.zip
          test -x kernel_workspace/clang19/bin/clang

      - name: Fetch exact stock ACK source
        run: |
          mkdir -p source/kernel_platform/common
          git -C source/kernel_platform/common init -q
          git -C source/kernel_platform/common remote add origin https://android.googlesource.com/kernel/common
          git -C source/kernel_platform/common fetch --depth=1 --filter=blob:none origin "$STOCK_COMMIT"
          git -C source/kernel_platform/common checkout -q --detach FETCH_HEAD
          test "$(git -C source/kernel_platform/common rev-parse HEAD)" = "$STOCK_COMMIT"

      - name: Build and verify stock-compatible Image
        env:
          KSU_TYPE: ${{ inputs.ksu_type }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: bash scripts/build.sh

      - name: Package boot-only flashable zip
        run: bash scripts/package.sh artifacts/Image "${{ github.workspace }}/oneplus15-stock-hmbird-${{ github.run_number }}.zip"

      - name: Save caches
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            kernel_workspace
            .ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: oneplus15-stock-hmbird-${{ github.run_number }}
          path: |
            artifacts/Image
            artifacts/config
            artifacts/System.map
            logs/compatibility.txt
            oneplus15-stock-hmbird-*.zip
          if-no-files-found: error
          retention-days: 14
