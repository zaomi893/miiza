name: Build OnePlus 15 HMBIRD kernel
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Official aligned source branch
        required: true
        default: oneplus/sm8850_b_16.0.0_oneplus_15
      run_build:
        description: Attempt public Kleaf canoe build
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet
      - name: Prepare cache directories
        run: mkdir -p ~/.cache/kernel-deps ~/.cache/bazel-repo ~/.cache/bazel-disk
      - name: Cache immutable source dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/kernel-deps
          key: kernel-deps-v1-${{ runner.os }}-${{ runner.arch }}-ndk-r26-main-kernel-2025
      - name: Restore Bazel caches
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.branch }}-${{ hashFiles('scripts/build.sh') }}
          restore-keys: |
            bazel-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.branch }}-
      - name: Assemble aligned official sources
        env:
          KERNEL_DEPS_CACHE: /home/runner/.cache/kernel-deps
        run: ./scripts/assemble.sh
      - name: Verify HMBIRD II
        run: ./scripts/check_hmbird.sh
      - name: Attempt public Kleaf build
        if: inputs.run_build
        id: build
        continue-on-error: true
        env:
          BAZEL_REPOSITORY_CACHE: /home/runner/.cache/bazel-repo
          BAZEL_DISK_CACHE: /home/runner/.cache/bazel-disk
        run: ./scripts/build.sh
      - name: Save Bazel caches
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
      - name: Record upstream limitation
        if: inputs.run_build && steps.build.outcome != 'success'
        run: |
          mkdir -p logs
          printf '%s\n' 'Official oplus_build.sh requires a previously built proprietary VND Android environment.' 'No incomplete output is represented as flashable vendor_dlkm.' > logs/LIMITATION.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oneplus15-hmbird-${{ github.run_number }}
          path: |
            artifacts/**
            logs/**
            hmbird-targets.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Fail workflow if Kleaf build failed
        if: always() && inputs.run_build && steps.build.outcome != 'success'
        run: exit 1
