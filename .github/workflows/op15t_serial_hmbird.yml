name: 6.12.38 一加15T 序列号锁与风驰增量验证
run-name: 15T serial+hmbird · ${{ inputs.device_serial }}

on:
  workflow_dispatch:
    inputs:
      device_serial:
        description: '绑定设备序列号'
        required: true
        type: string
        default: '3B1633003EB00000'

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OP_TOTAL_DEVICES: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 12G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_IGNOREOPTIONS: '--sysroot*'
      CCACHE_COMPRESSION: 'true'
      CCACHE_COMPRESSION_LEVEL: '3'
      CCACHE_DIRECT: 'true'
      CCACHE_FILE_CLONE: 'true'
      CCACHE_NOINODECACHE: 'true'
      CCACHE_IS_KERNEL_COMPILING: 'true'
      CCACHE_UMASK: '002'
      CCACHE_SLOPPINESS: 'file_macro,time_macros,pch_defines,system_headers,locale'

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v6

      - name: 释放完整源码构建空间
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/aws-sam-cli \
            /usr/local/share/chromium /usr/local/lib/heroku /opt/az \
            /opt/microsoft/powershell /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/PyPy /usr/local/julia* || true
          sudo apt-get clean
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: 安装上游构建依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld flex bison libelf-dev libssl-dev \
            libncurses-dev zlib1g-dev liblz4-tool libxml2-utils rsync \
            unzip dwarves file python3 ccache jq bc dos2unix kmod \
            libdw-dev elfutils pigz
          sudo apt-get clean

      - name: 完整上游基线加入序列号锁与风驰兼容
        id: kernel
        uses: ./.github/actions/op15t-build
        with:
          op_config_json: '{"model":"OP15T","soc":"canoe","branch":"wild/sm8850","manifest":"oneplus_15t_w.xml","android_version":"android16","kernel_version":"6.12","os_version":"A16","lto":"none","zyc_compiler":"","c_compiler":"kernel_platform/prebuilts/clang/host/linux-x86/clang-r547379/bin","rust_compiler":"kernel_platform/prebuilts/rust/linux-x86/1.82.0/bin","bindgen":"","rust_build":true,"disk_cleanup":true,"hmbird":false,"NMS":true,"opt":false,"ds":false,"bbg":false,"bbr":true,"bbr3":true,"ttl":true,"ip_set":true,"unicode":true,"ntsync":false,"blacklist_modules":"oplus_secure_guard_new","uname":"5-g844001fb8721-ab14552068-4k"}'
          ksu_type: RSKSU
          ksu_branch_or_hash: f1dd81dc96d7f3f6691e6ac8b50fba9ae8a2f17c
          build_timestamp: 'Fri Dec 5 02:05:55 UTC 2025'
          optimize_level: O2
          clean: false
          debug: false
          enable_adios: false
          nomount_ref: main
          patches_ref: main
          github_token: ${{ secrets.GH_TOKEN }}
          device_serial: ${{ inputs.device_serial }}
          serial_lock_enable: 'true'
          hmbird_compat_enable: 'true'

      - name: 构建同源一加15T风驰模块元数据
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/OP15T"
          git init oplus_modules
          git -C oplus_modules remote add origin \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8850.git
          git -C oplus_modules sparse-checkout init --cone
          git -C oplus_modules sparse-checkout set vendor/oplus/kernel/cpu
          git -C oplus_modules fetch --depth=1 --filter=blob:none origin \
            bc8d91d1e146be96d2e27bebe8f753f82bdebeee
          git -C oplus_modules checkout --detach FETCH_HEAD

          COMMON="$PWD/kernel_platform/common"
          MODULE_DIR="$PWD/oplus_modules/vendor/oplus/kernel/cpu"
          cp "$GITHUB_WORKSPACE/hmbird_module/Makefile.oneplus15t" "$MODULE_DIR/Makefile"
          find "$MODULE_DIR/sched_ext" -type f \( -name '*.c' -o -name '*.h' \) -print0 | \
            xargs -0 sed -i -E \
              -e 's#[<"]\.\./kernel/sched/sched\.h[>"]#<kernel/sched/sched.h>#g' \
              -e 's#[<"]\.\./\.\./kernel/sched/sched\.h[>"]#<kernel/sched/sched.h>#g' \
              -e 's#<linux/sa_common\.h>#<sa_common.h>#g'
          [ -s "$COMMON/out/Module.symvers" ] || \
            cp "$COMMON/out/vmlinux.symvers" "$COMMON/out/Module.symvers"
          export PATH="$PWD/kernel_platform/prebuilts/clang/host/linux-x86/clang-r547379/bin:$PWD/kernel_platform/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
          export LIBCLANG_PATH="$PWD/kernel_platform/prebuilts/clang/host/linux-x86/clang-r547379/lib"
          make -C "$COMMON" O=out LLVM=1 ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld \
            OBJCOPY=llvm-objcopy modules_prepare
          make -C "$COMMON" O=out M="$MODULE_DIR" V=1 KBUILD_MODPOST_WARN=1 \
            LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld OBJCOPY=llvm-objcopy modules

          HMBIRD_KO="$MODULE_DIR/oplus_bsp_sched_ext.ko"
          test -s "$HMBIRD_KO"
          mkdir -p "$GITHUB_WORKSPACE/hmbird_15t_research"
          llvm-objcopy --dump-section \
            .BTF="$GITHUB_WORKSPACE/hmbird_15t_research/gki-module.btf" "$HMBIRD_KO"
          llvm-objcopy --dump-section \
            .BTF_ids="$GITHUB_WORKSPACE/hmbird_15t_research/gki-module.btf_ids" "$HMBIRD_KO"
          cp "$HMBIRD_KO" "$GITHUB_WORKSPACE/hmbird_15t_research/"
          modinfo "$HMBIRD_KO" > "$GITHUB_WORKSPACE/hmbird_15t_research/modinfo.txt"
          modprobe --dump-modversions "$HMBIRD_KO" \
            > "$GITHUB_WORKSPACE/hmbird_15t_research/modversions.txt"

      - name: 将匹配的风驰 BTF 元数据写入本次 Image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GITHUB_WORKSPACE/OP15T/kernel_platform/common/out/arch/arm64/boot/Image"
          BTF="$GITHUB_WORKSPACE/hmbird_15t_research/gki-module.btf"
          IDS="$GITHUB_WORKSPACE/hmbird_15t_research/gki-module.btf_ids"
          test "$(stat -c%s "$BTF")" -gt 0
          test "$(stat -c%s "$BTF")" -le 32768
          test "$(stat -c%s "$IDS")" -eq 320
          python3 - "$IMAGE" "$BTF" "$IDS" <<'PY'
          from pathlib import Path
          import sys

          image_path = Path(sys.argv[1])
          image = bytearray(image_path.read_bytes())
          payloads = (
              (b"HMBIRD_BTF_SLOT", Path(sys.argv[2]).read_bytes(), 32768, False),
              (b"HMBIRD_IDS_SLOT", Path(sys.argv[3]).read_bytes(), 320, True),
          )
          offsets = {}
          for marker, payload, capacity, exact in payloads:
              if not payload or len(payload) > capacity or (exact and len(payload) != capacity):
                  raise SystemExit(f"invalid payload for {marker!r}: {len(payload)}")
              matches = []
              start = 0
              while True:
                  offset = image.find(marker, start)
                  if offset < 0:
                      break
                  if len(image) - offset >= capacity and not any(image[offset + len(marker):offset + capacity]):
                      matches.append(offset)
                  start = offset + 1
              if len(matches) != 1:
                  raise SystemExit(f"slot resolution failed for {marker!r}: {matches}")
              offset = matches[0]
              image[offset:offset + capacity] = payload + bytes(capacity - len(payload))
              offsets[marker] = offset

          size_marker = b"HMBIRD_LEN_SLOT"
          size_offset = image.find(size_marker)
          if size_offset < 0 or image.find(size_marker, size_offset + 1) >= 0:
              raise SystemExit("BTF size slot is missing or ambiguous")
          size_record = len(payloads[0][1]).to_bytes(4, "little") + b"BTFSIZEV001"
          image[size_offset:size_offset + len(size_marker)] = size_record
          image_path.write_bytes(image)
          verify = image_path.read_bytes()
          for marker, payload, _, _ in payloads:
              offset = offsets[marker]
              if verify[offset:offset + len(payload)] != payload:
                  raise SystemExit(f"payload readback failed for {marker!r}")
          PY
          grep -aFq 'using embedded matching GKI BTF metadata' "$IMAGE"
          ! grep -aFq 'HMBIRD_BTF_SLOT' "$IMAGE"
          ! grep -aFq '__OPLUS_SERIAL_' "$IMAGE"
          sha256sum "$IMAGE" "$BTF" "$IDS"

      - name: 使用 cvhhji AnyKernel3 打包
        id: package
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch master \
            "https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/cvhhji/AnyKernel3.git" own-ak3
          rm -rf own-ak3/.git
          cp "$GITHUB_WORKSPACE/OP15T/kernel_platform/common/out/arch/arm64/boot/Image" \
            own-ak3/Image
          install -m 0644 "$GITHUB_WORKSPACE/serial_lock/build-token" \
            own-ak3/serial_lock/build-token
          test -s own-ak3/serial_lock/install.sh
          test -s own-ak3/serial_lock/post-fs-data.sh
          test ! -e own-ak3/serial_lock/module.prop
          test "$(wc -c < own-ak3/serial_lock/build-token)" -eq 65
          SERIAL=$(printf '%s' '${{ inputs.device_serial }}' | tr -cd 'A-Za-z0-9._:-')
          ZIP="AK3_OP15T_6.12.38_RSKSU35119_SERIAL_HMBIRD_SN-${SERIAL}.zip"
          (cd own-ak3 && zip -r9 "$GITHUB_WORKSPACE/$ZIP" . -x '*.git*')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: 删除复合动作上传的未注入风驰元数据包
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("AK3_OP15T_A16_")) | .id' \
            | while read -r id; do
                [ -n "$id" ] && gh api -X DELETE \
                  "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              done

      - name: 上传唯一的序列号锁与风驰测试包
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          archive: false
          compression-level: 0
          retention-days: 14

      - name: 上传风驰校验资料
        uses: actions/upload-artifact@v7
        with:
          name: OP15T-hmbird-metadata-${{ inputs.device_serial }}
          path: hmbird_15t_research
          retention-days: 14
